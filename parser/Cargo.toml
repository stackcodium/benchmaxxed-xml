[package]
name = "xml-parser"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Dependency-free safe-Rust XML parsing, compact DOM, mutable DOM, and XPath"
readme = "README.md"
documentation = "https://docs.rs/xml-parser"
keywords = ["xml", "parser", "dom", "xpath", "serialization"]
categories = ["parser-implementations", "data-structures", "encoding"]

[lib]
name = "xml_parser"
path = "src/lib.rs"

[dependencies]

[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
